    <h1>臺灣野鳥</h1>
    <p>臺灣不僅孕育了許多特有種鳥類，也是許多候鳥過冬的庇護所，
    例如黑面琵鷺、小青足鷸、大白鷺、鷹斑鷸、蒼鷺、戴勝、灰鶺鴒、
    高蹺鴴、小環頸鴴、燕鴴、反嘴鴴、金斑鴴、中白鷺、赤腹鷹、
    八色鳥、花嘴鴨等。這裡為您介紹三種：</p>
    <ul>
      <li><a href="#bird1">黑面琵鷺</a></li>
      <li><a href="#bird2">赤腹鷹</a></li>
      <li><a href="#bird3">八色鳥</a></li>
    </ul>
    <hr>
    <dl>
      <dt id="bird1">黑面琵鷺</dt>
      <dd>最早的棲息地是韓國及中國北方沿海，近年來在臺灣的
          曾文溪口沼澤地找到了新的棲息地。</dd>
      <dt id="bird2">赤腹鷹</dt>
      <dd>每年八、九月成群過境墾丁、恆春一帶，
          愛鷹人士千萬不能錯過。</dd>
      <dt id="bird3">八色鳥</dt>
      <dd>每年夏天從東南亞飛到臺灣繁殖，羽色艷麗，
          可以說是山林中的漂亮寶貝。</dd>
    </dl>
