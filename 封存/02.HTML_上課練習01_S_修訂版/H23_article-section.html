<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>唐詩欣賞</title>
  </head>
  <body>
    <article>
      <!-- hgroup：一個標題，加上副標或標語用 <p> -->
      <hgroup>
        <h1>唐詩</h1>
        <p>五言絕句</p>
      </hgroup>
      <p>五言絕句為近體詩的一種，每首四句，每句五字，共二十字。</p>
      <section>
        <h2>送別</h2>
        <p>山中相送罷，日暮掩柴扉。春草年年綠，王孫歸不歸。</p>
      </section>
      <section>
        <h2>鹿柴</h2>
        <p>空山不見人，但聞人語響。返景入深林，復照青苔上。</p>
      </section>
    </article>
  </body>
</html>
