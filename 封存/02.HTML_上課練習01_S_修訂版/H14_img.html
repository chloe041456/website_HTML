<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>示範圖片</title>
  </head>
  <body>
    <!-- alt：替代文字，圖片無法顯示時出現 -->
    <!-- 只設 width：高度依比例自動計算 -->
    <img src="jp3.jpg" alt="城堡建築" width="200">
    <img src="jp3.jpg" alt="城堡建築" width="100">
    <!-- 同時設 width 和 height：比例不對會變形 -->
    <img src="jp3.jpg" alt="城堡（變形）" width="200" height="100">
  </body>
</html>
