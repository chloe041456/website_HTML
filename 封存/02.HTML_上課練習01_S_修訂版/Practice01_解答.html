<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>臺灣野鳥小圖鑑</title>
    <style>
      /* 已備好的版面樣式：只要標籤用對，就會自動排好 */
      body { max-width: 960px; margin: 0 auto; font-family: sans-serif; }
      header, footer { background: #dbe7f5; padding: 8px 16px; }
      nav ul { list-style: none; padding: 0; }
      nav li { display: inline; margin-right: 16px; }
      main { float: left; width: 68%; }
      aside { float: right; width: 28%; background: #f3f3f3; padding: 0 12px; }
      footer { clear: both; }
      table, th, td { border: 1px solid #999; }
      table { border-collapse: collapse; }
      th, td { padding: 4px 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>臺灣野鳥小圖鑑</h1>
      <nav>
        <ul>
          <li><a href="#winter">冬候鳥</a></li>
          <li><a href="#summer">夏候鳥</a></li>
          <li><a href="#record">觀察紀錄</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <article id="winter">
        <h2>冬候鳥</h2>
        <section>
          <h3>黑面琵鷺</h3>
          <p>每年秋冬來到臺南曾文溪口過冬，嘴巴像一支<strong>黑色飯匙</strong>。</p>
        </section>
        <section>
          <h3>小環頸鴴</h3>
          <p>常在河口沙灘快步奔跑，眼睛周圍有一圈金黃色眼圈。</p>
        </section>
      </article>
      <article id="summer">
        <h2>夏候鳥</h2>
        <section>
          <h3>八色鳥</h3>
          <p>夏天從東南亞飛到臺灣繁殖，羽毛有八種顏色。</p>
        </section>
      </article>
      <section id="record">
        <h2>觀察紀錄</h2>
        <table>
          <caption>本學期賞鳥紀錄</caption>
          <tr><th>日期</th><th>地點</th><th>鳥種</th></tr>
          <tr><td>10/12</td><td>關渡自然公園</td><td>小環頸鴴</td></tr>
          <tr><td>11/02</td><td>曾文溪口</td><td>黑面琵鷺</td></tr>
        </table>
      </section>
    </main>
    <aside>
      <h2>賞鳥小提醒</h2>
      <ol>
        <li>穿著大地色系衣服</li>
        <li>保持安靜、不餵食</li>
        <li>帶望遠鏡和圖鑑</li>
      </ol>
      <p><a href="https://www.bird.org.tw/" target="_blank">中華民國野鳥學會</a></p>
    </aside>
    <footer>
      <address>製作：王小明（<a href="mailto:student@example.com">聯絡我</a>）</address>
    </footer>
  </body>
</html>
