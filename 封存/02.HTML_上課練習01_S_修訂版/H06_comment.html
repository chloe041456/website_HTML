    <title>示範註解</title>
  </head>
  <body>
    <!-- 以下為《大學》經一章「大學之道」 -->
    <p>大學之道在明明德，在親民，在止於至善。
    知止而后有定，定而后能靜，靜而后能安，
    安而后能慮，慮而后能得。物有本末，事有
    終始，知所先後，則近道矣。</p>
  </body>
