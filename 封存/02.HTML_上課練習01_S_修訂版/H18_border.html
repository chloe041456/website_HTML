<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>示範表格框線</title>
    <style>
      /* 只有 class="lined" 的表格才畫框線 */
      .lined, .lined th, .lined td { border: 1px solid #999; }
      .lined { border-collapse: collapse; }
      th, td { padding: 4px 8px; text-align: left; }
    </style>
  </head>
  <body>
    <h2>有框線（.lined）</h2>
    <table class="lined">
      <tr><th>角色</th><th>介紹</th></tr>
      <tr><td>喬巴</td><td>身份船醫，夢想成為能治百病的神醫。</td></tr>
      <tr><td>索隆</td><td>主角魯夫的夥伴，夢想成為世界第一的劍士。</td></tr>
    </table>
    <h2>無框線（取代 frame="void"）</h2>
    <table>
      <tr><th>角色</th><th>介紹</th></tr>
      <tr><td>喬巴</td><td>身份船醫，夢想成為能治百病的神醫。</td></tr>
      <tr><td>索隆</td><td>主角魯夫的夥伴，夢想成為世界第一的劍士。</td></tr>
    </table>
  </body>
</html>
