<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>營收</title>
    <style>
      /* 表格框線：HTML5 改用 CSS 設定（取代 border="1"） */
      table, th, td { border: 1px solid #999; }
      table { border-collapse: collapse; }
      th, td { padding: 4px 8px; }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <td rowspan="2">&nbsp;</td>
          <th colspan="2" scope="colgroup">113年</th>
          <th colspan="2" scope="colgroup">114年</th>
        </tr>
        <tr>
          <th scope="col">營收（百萬）</th>
          <th scope="col">純益（百萬）</th>
          <th scope="col">營收（百萬）</th>
          <th scope="col">純益（百萬）</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">幸福</th>
          <td>3953</td>
          <td>1245</td>
          <td>3687</td>
          <td>763</td>
        </tr>
        <tr>
          <th scope="row">飛達</th>
          <td>5193</td>
          <td>1420</td>
          <td>4143</td>
          <td>932</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
